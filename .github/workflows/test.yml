name: CI - Lint & Multi-Agent Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install SUMO for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes sumo sumo-tools
          echo "SUMO_HOME=/usr/share/sumo" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt -c requirements-pinned.txt

      - name: Lint with flake8
        run: |
          # Stop build on syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings on style
          flake8 src/ --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

      - name: Verify Multi-Agent Modules and Imports
        run: |
          python -c "from src.multi_env import MultiIntersectionEnv; print('MultiIntersectionEnv OK')"
          python -c "from src.agents.mappo_agent import MAPPOTrafficController; print('MAPPO Controller OK')"
          python -c "from src.agents.ippo_agent import IPPOController; print('IPPO Controller OK')"
          python -c "from src.agents.gnn_policy import GNNTrafficPolicy; print('GNN Policy OK')"
          python -c "from src.routing import DynamicRouter; print('Dynamic Router OK')"
          python -c "from src.metrics import TrafficMetricsCalculator; print('Metrics Calculator OK')"
           python -c "from src.environment import SumoTrafficEnv; print('Legacy Environment OK')"

      - name: Run automated tests
        run: python -m pytest -q

      - name: Neural Network Architecture Smoke Test
        run: |
          python -c "
          import torch
          from src.agents.mappo_agent import MAPPOTrafficController
          from src.agents.gnn_policy import GNNTrafficPolicy
          
          # Test MAPPO Network Forward Pass
          mappo = MAPPOTrafficController(n_agents=4, obs_dim=38, action_dim=2, device='cpu')
          dummy_obs = {f'TLS_{i}': torch.randn(38).numpy() for i in range(4)}
          actions, log_probs, val, gstate = mappo.select_actions(dummy_obs)
          assert len(actions) == 4
          print('MAPPO forward pass verified!')
          
          # Test GNN Policy Forward Pass
          gnn = GNNTrafficPolicy(node_feature_dim=26, hidden_dim=32, action_dim=2)
          logits, values = gnn(torch.randn(4, 26), torch.eye(4))
          assert logits.shape == (4, 2)
          print('GNN policy verified!')
          "
